  text: 欽定四庫全書史部十五
  hash: sha256:4a540dfc960a59c2dec4cdfbeae70a4cdb4cf072e21e65c814c7bffa22e3211a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2o0016_WYG_000-1a, image: WYG0688/WYG0688-0001a.png}
body:
  text: 厯代通略史評類提要臣等謹案厯代通略四卷元陳櫟撰是編叙厯代興廢得失各為論斷每一代為一篇自伏羲至五代為二卷北宋南宋則各占一卷蓋詳近略逺之意也南宋止于寧宗卷末櫟自跋謂理度二朝無史可據也舊本題增廣通略而不言因誰氏之書千頃堂書目有通略句解五卷亦不言作者櫟自跋謂金事廷方雖略述亦以未見其史不敢輕筆然則廷方其原撰是書之名字歟其時代姓氏爵里則無考矣書成于至大庚戍明正統壬戌櫟孫盤之壻漢陽知府王靜得本于鄉人方勉始刋行之此本則袁應兆所刻題乙亥嵗不著年號後附櫟䝉求一篇其䝉求末四韻兼及明初句下注曰此八句為朱楓林所增然原文迄於崖山句下注宋為元逼云云殊不類當時之語殆亦有所改竄矣是書雖撮叙大綱不免簡略而持論醇正以資考證則不足以論是非則讀史者固有取焉乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀歷代通略序余自弱嵗弄柔翰而觀羣書竊好通鑑為用世所資如紫陽全書系統既詳屬辭復博誠有功聖門與六經並垂不易矣但通人過眼有得而小學輒苦汗漫罕能旁徹不無望洋自失之嘆定宇先生學有本領析理精實嘗取歷代通略而增廣之鑽研補益不倚於藻繢不涉於裒侈大都刪煩歸簡指其要領以授而又補缺正訛褒貶不誣雖節取事辭要以綱目之與前續篇不外是矣惜刋板歷久湮落識者慨焉兹值郡守陸公志崇風教喜著書訓世獲陳生文科所藏原本善之曰懿哉集也質而不蕪亦詳而有體前人用心良苦非我誰為章顯者遂裁正而叙之屬余重梓以廣其𫝊於不朽母猶得其少遺其多哉蓋言有纍牘而滋疑理有單詞而已解治書之法在約之以標其指非約之以去其要故不詳則亦不能略能略必不失其為詳是書略於人者未嘗略於其故略於事者未嘗略於其志從來治亂之原較然粲如列眉聨若編珠所謂一勺具海味𤣥尊有餘情者也又惡用泛泛若涉水於滄茫游游若獵獸於廣野敝精叢藪求無掛漏至智浪紛競口咨鼻酸而不知返乎況張敬夫曰通鑑有未盡處縱使懷抱羅今古討論窮藝府而博而置要勞而少功奚益哉余不敏餐素宫牆嘗臠著述仰止髙風師資自幸兹復樂先生所以為惠來學之願有成殆士類之鴻寶非一家之天球後之覽者一讀即了當不苦翻閲之難竟更不見意義之不足也嵗乙亥仲秋既望建業後學袁應兆撰并書
