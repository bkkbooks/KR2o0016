body:
  text: 歴代通畧䝉求太極既判髙下定位輕清為天重濁為地中處者人必立之君三皇伏羲神農黄帝五帝少昊顓頊帝嚳唐堯虞舜世質民淳伏羲畫卦更造書文字契符券炎帝神農教民耒耜耜以起土耒其柄也黄帝軒轅神化宜民始垂衣裳皇風愈惇厚也皇降而帝少昊有作顓頊繼之授之帝嚳唐帝曰堯捨子丹朱詢事考言讓於有虞舜徳重華樂曰韶舞亦捨商均讓於大禹惟此五帝實官天下官天下𫝊聖賢家天下者家天下𫝊子孫始於有夏啟賢能繼禹因傳啟三王𫝊子夏禹商湯周文武也實始於此桀虐而亡共十七君祚𫝊祿曰祚四百年商湯代興太甲太戊盤庚武丁凡六七君賢聖挺生紂為無道罪浮于桀祚六百年為周所滅周自后稷積徳累仁文王宜王猶服事殷武王伐紂天下歸周卜世卜年古今無儔周成王定鼎卜世三十卜年七百其後三十六世八百六十七年皆過其數成成王康康王俱賢泰和極治平王東遷春秋攸始孔子修魯史春秋始于平王之四十九年五霸相繼齊桓晉文秦穆宋襄楚莊尊周為名降為戰國七雄分爭齊楚燕趙韓魏秦赧王入秦周厯遂訖享年最永八百七十秦併六國狼吞虎噬謂兼三三皇五五帝始稱皇帝盡掃良法焚書坑儒二世而亡咸陽為墟漢髙髙帝勃興寛仁大度誅秦蹙項項羽光啟炎祚文文帝景景帝恭儉休養生息武帝窮黷窮兵黷武孝宣宣帝綜核元元帝成成帝柔弱哀平短祚王莽簒竊實門光武同符髙帝西漢遂東三世賢主顯宗明帝肅宗章帝𫝊世十二終于靈靈帝獻獻帝漢祚四百人心未厭曹操子丕簒漢為魏帝室之胄本其所出曰胄蜀主劉備呉主孫權開國江東三分鼎峙各為長雄孰能一之晉司馬氏歴懿師昭炎為武帝開基肇亂子愚婦逆懐懐帝愍愍帝孤立擒于劉劉聰曜石石勒元帝渡江國曰東晉十世而亡宋武武帝應運自晉中微羣雄雲擾五涼前涼後涼南涼北涼西涼四燕前燕後燕南燕北燕三秦前秦後秦西秦二趙前趙後趙一夏一蜀紛紛僭竊正朔相承王者頒歴年以某月為正月以某日為朔日獨推建業南朝都建康僭竊俱亡併於元魏元王之魏國南北分王垂三百祀元魏遷洛亦曰賢君南歴五朝都建康者東晉宋齊梁陳為五朝上併吳則為六朝宋齊梁陳宋始劉裕齊蕭道成蕭衍梁繼霸先陳興元魏之衰分而為二髙及宇文各簒其位東魏髙歡之子簒之西魏宇文泰之子簒之髙為北齊宇文併之宇文之周又滅于隋隋主楊堅本無功徳平陳後主幸爾混一再傳煬帝以奢侈亡天亦厭亂業歸李唐唐起義兵始於髙祖佐以太宗實為英主繼以𤣥憲𤣥宗憲宗稱唐三宗閨門多慚雜以司晨外亂藩鎮内亂宦官訖于唐亡亦三百年五代繼之梁唐晉漢周始于朱梁唐李存勗晉石敬塘漢劉智逺周祖郭威共五十年君如奕棋于峕小國各據偏方二漢南漢北漢二蜀吳楚南唐荆閩吳越紛然僭竊趙氏太祖繼以太宗掃除僭國宋業以隆真仁英神真宗仁宗英宗神宗俱稱賢君誤于新法引進小人哲哲宗繼以徽徽宗及禪于欽欽宗金師已逼父子䝉塵髙宗南渡南行渡江孝孝宗亦賢主保境偷安光寧理度光宗寧宗理宗度宗迄于崖山崖山海島名也宋為元逼覆海而亡亦三百祀代金平宋是為大元九十三載一十四𫝊洪惟聖朝大明麗天宏基其治垂統萬年末八句係朱楓林先生増陳定宇先生䝉求之作但摽掲歴代相𫝊興衰之畧而未暇及政事人物治亂得失之詳約之共八百言而上下數千年間道有升降統有正變祚有長短勢有離合頃刻可知其槩此誠初學史者之入門如舉網得綱而萬目可從理也是以朱楓林先生有取焉邑人新陽黄金色識
